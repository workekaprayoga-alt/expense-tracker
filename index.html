<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#a04361">
<meta name="theme-color" content="#1c1418" media="(prefers-color-scheme: dark)">
<title>Catatan Belanja</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-header">
  <div class="app-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  </div>
  <div>
    <h1>Catatan belanja</h1>
    <p class="subtitle" style="margin: 0;">Untuk rumah, anak & kita</p>
  </div>
</div>

<!-- Greeting / kalimat semangat -->
<div class="card greeting-card" id="greeting-card">
  <div class="greeting-sapaan">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
    <span id="greeting-time">Selamat pagi</span>
  </div>
  <div class="greeting-name" id="greeting-name">Sayang ❤</div>
  <div class="greeting-quote" id="greeting-quote">…</div>
  <div class="greeting-sub" id="greeting-sub"></div>
</div>

<!-- Summary -->
<div class="card card-elevated">
  <div class="summary-label" id="period-label">Total bulan ini</div>
  <div class="summary-amount" id="total">Rp 0</div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="summary-meta" id="meta">Memuat…</div>
</div>

<!-- Chart -->
<div class="card">
  <div class="section-title">7 hari terakhir</div>
  <div class="chart-container" id="chart"></div>
</div>

<!-- Templates -->
<div class="card" id="templates-card" style="display: none;">
  <div class="section-title">Pengeluaran rutin · sekali tap</div>
  <div id="templates-list"></div>
</div>

<!-- Form input -->
<div class="card">
  <div class="section-title">✍ Catat pengeluaran</div>

  <label>Nominal</label>
  <input type="text" id="amount" inputmode="numeric" placeholder="contoh: 50.000">
  <div class="quick-row">
    <button class="quick-btn" data-quick="1000">+ 1rb</button>
    <button class="quick-btn" data-quick="5000">+ 5rb</button>
    <button class="quick-btn" data-quick="10000">+ 10rb</button>
    <button class="quick-btn" data-quick="50000">+ 50rb</button>
  </div>

  <label>Untuk apa?</label>
  <input type="text" id="note" placeholder="contoh: belanja sayur">

  <label>Kategori</label>
  <div class="opt-grid" id="cats"></div>

  <label>Pesan untuk suami (opsional)</label>
  <textarea id="message" placeholder="contoh: lagi diskon, beli 2 dus" rows="2"></textarea>

  <button class="save-btn" id="save">Simpan</button>
  <div class="msg" id="msg"></div>
</div>

<!-- Rekap -->
<div class="card">
  <div class="section-title">Rekap</div>
  <div class="filter-row two">
    <button class="filter-btn active" data-period="month">Bulan ini</button>
    <button class="filter-btn" data-period="week">7 hari</button>
  </div>
  <div class="filter-row two">
    <button class="filter-btn active" data-view="list">Daftar</button>
    <button class="filter-btn" data-view="cat">Per kategori</button>
  </div>
  <div id="content"><div class="loading">Memuat data</div></div>
</div>

<!-- Modal Edit -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit pengeluaran</h2>
      <button class="modal-close" onclick="closeEditModal()" aria-label="Tutup">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <label>Nominal</label>
    <input type="text" id="edit-amount" inputmode="numeric">

    <label>Untuk apa?</label>
    <input type="text" id="edit-note">

    <label>Kategori</label>
    <div class="opt-grid" id="edit-cats"></div>

    <label>Pesan untuk suami (opsional)</label>
    <textarea id="edit-message" rows="2"></textarea>

    <button class="save-btn" onclick="saveEdit()">Simpan perubahan</button>
    <div class="msg" id="edit-msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
let selectedCat = null;
let editSelectedCat = null;
let editingId = null;
let currentPeriod = 'month';
let currentView = 'list';
let cachedData = [];
let templates = [];
let isSaving = false;

// ===== Greeting (kalimat semangat) =====
function initGreeting() {
  document.getElementById('greeting-time').textContent = getSapaan();
  document.getElementById('greeting-name').innerHTML =
    escapeHtml(typeof PANGGILAN_ISTRI !== 'undefined' ? PANGGILAN_ISTRI : 'Sayang') + ' ❤';
  const k = getKalimatHariIni();
  if (k) {
    document.getElementById('greeting-quote').textContent = '"' + k.quote + '"';
    document.getElementById('greeting-sub').textContent = '— ' + k.sub;
  }
  // Tap greeting card buat ganti kalimat random
  document.getElementById('greeting-card').addEventListener('click', () => {
    if (!KALIMAT_SEMANGAT || !KALIMAT_SEMANGAT.length) return;
    const r = KALIMAT_SEMANGAT[Math.floor(Math.random() * KALIMAT_SEMANGAT.length)];
    document.getElementById('greeting-quote').textContent = '"' + r.quote + '"';
    document.getElementById('greeting-sub').textContent = '— ' + r.sub;
    if (navigator.vibrate) navigator.vibrate(15);
  });
}

// ===== Build category buttons =====
function buildCatButtons(container, onSelect) {
  container.innerHTML = '';
  CATEGORIES.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt-btn';
    b.dataset.cat = c.id;
    b.innerHTML = iconHtml(c.icon, 16) + '<span>' + escapeHtml(c.label) + '</span>';
    b.onclick = () => {
      onSelect(c.id);
      container.querySelectorAll('.opt-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      if (navigator.vibrate) navigator.vibrate(10);
    };
    container.appendChild(b);
  });
}
buildCatButtons(document.getElementById('cats'), id => { selectedCat = id; });
buildCatButtons(document.getElementById('edit-cats'), id => { editSelectedCat = id; });

// ===== Quick amount buttons + format =====
const amountInput = document.getElementById('amount');
initNumberInput(amountInput);
attachQuickButtons(document.querySelector('.quick-row'), amountInput);
initNumberInput(document.getElementById('edit-amount'));

// ===== Filters =====
document.querySelectorAll('[data-period]').forEach(btn => {
  btn.onclick = () => {
    currentPeriod = btn.dataset.period;
    document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('period-label').textContent =
      currentPeriod === 'month' ? 'Total bulan ini' : 'Total 7 hari terakhir';
    loadData();
  };
});

document.querySelectorAll('[data-view]').forEach(btn => {
  btn.onclick = () => {
    currentView = btn.dataset.view;
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderContent();
  };
});

// ===== Save expense =====
document.getElementById('save').onclick = async () => {
  if (isSaving) return;
  const amount = parseNum(amountInput.value);
  const note = document.getElementById('note').value.trim();
  const message = document.getElementById('message').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('save');

  if (!amount) { msg.className = 'msg err'; msg.textContent = 'Nominal belum diisi'; return; }
  if (!selectedCat) { msg.className = 'msg err'; msg.textContent = 'Pilih kategori dulu'; return; }

  isSaving = true;
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  msg.textContent = '';

  try {
    const data = await apiPost({
      action: 'add',
      amount: amount,
      note: note || getCategoryMeta(selectedCat).label,
      category: selectedCat,
      location: 'rumah',
      who: NAMA_ISTRI,
      message: message
    });
    if (data.ok) {
      // Floating heart animation
      spawnHeart(btn);
      toast('✓ Tersimpan, terima kasih ' + (typeof PANGGILAN_ISTRI !== 'undefined' ? PANGGILAN_ISTRI : 'Sayang') + ' ❤');
      amountInput.value = '';
      document.getElementById('note').value = '';
      document.getElementById('message').value = '';
      selectedCat = null;
      document.querySelectorAll('#cats .opt-btn').forEach(x => x.classList.remove('selected'));
      loadData();
    } else {
      msg.className = 'msg err'; msg.textContent = 'Gagal: ' + (data.error || '');
    }
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = 'Tidak ada koneksi';
  }
  isSaving = false;
  btn.disabled = false; btn.textContent = 'Simpan';
};

function spawnHeart(originEl) {
  const rect = originEl.getBoundingClientRect();
  const heart = document.createElement('div');
  heart.className = 'floating-heart';
  heart.textContent = '❤';
  heart.style.left = (rect.left + rect.width / 2 - 14) + 'px';
  heart.style.top = (rect.top - 10) + 'px';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1500);
  if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
}

// ===== Use template =====
async function useTemplate(tpl) {
  const ok = await confirmModal('Tambah "' + tpl.label + '" — ' + fmtRp(tpl.amount) + '?');
  if (!ok) return;
  try {
    const data = await apiPost({
      action: 'add',
      amount: tpl.amount,
      note: tpl.note || tpl.label,
      category: tpl.category,
      location: 'rumah',
      who: NAMA_ISTRI,
      message: ''
    });
    if (data.ok) { toast('✓ Tersimpan'); loadData(); }
    else toast('Gagal menyimpan', 'err');
  } catch (e) { toast('Tidak ada koneksi', 'err'); }
}

// ===== Load data =====
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">Memuat</div>';
  try {
    const res = await apiGet({ type: 'expenses', scope: 'rumah', period: currentPeriod });
    if (res.ok) {
      cachedData = res.data;
      renderSummary();
      renderContent();
    }
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Tidak ada koneksi</div>';
  }
  loadChart();
  loadTemplates();
}

async function loadTemplates() {
  try {
    const res = await apiGet({ type: 'templates' });
    if (res.ok) {
      templates = res.data.filter(t => t.location === 'rumah');
      renderTemplates();
    }
  } catch (e) {}
}

function renderTemplates() {
  const card = document.getElementById('templates-card');
  const list = document.getElementById('templates-list');
  if (templates.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  list.innerHTML = '';
  templates.forEach((t, i) => {
    const cat = getCategoryMeta(t.category);
    const btn = document.createElement('button');
    btn.className = 'template-chip';
    btn.dataset.idx = i;
    btn.innerHTML = iconHtml(cat.icon, 14) + escapeHtml(t.label) + ' · ' + fmtRp(t.amount);
    btn.onclick = () => useTemplate(templates[i]);
    list.appendChild(btn);
  });
}

async function loadChart() {
  try {
    // Pakai expenses scope=rumah supaya chart istri = pengeluaran rumah saja
    const expRes = await apiGet({ type: 'expenses', scope: 'rumah', period: 'week' });
    if (!expRes.ok) return;

    // Build 7 hari terakhir lokal
    const today = new Date();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      days.push({ date: localDateKey(d), total: 0, isToday: i === 0 });
    }

    expRes.data.forEach(e => {
      const key = localDateKey(e.timestamp);
      const day = days.find(d => d.date === key);
      if (day) day.total += e.amount;
    });

    const max = Math.max(...days.map(d => d.total), 1);
    const chartEl = document.getElementById('chart');
    chartEl.innerHTML = days.map(d => {
      const pct = (d.total / max) * 100;
      const dt = new Date(d.date + 'T00:00:00');
      const dayLabel = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'][dt.getDay()];
      return '<div class="chart-bar' + (d.isToday ? ' today' : '') + '">' +
        (d.total > 0 ? '<div class="chart-bar-value">' + fmtNum(d.total / 1000) + 'rb</div>' : '') +
        '<div class="chart-bar-fill" style="height: ' + pct + '%;"></div>' +
        '<div class="chart-bar-label">' + dayLabel + '</div>' +
        '</div>';
    }).join('');
  } catch (e) {}
}

function renderSummary() {
  const total = cachedData.reduce((s, d) => s + d.amount, 0);
  document.getElementById('total').textContent = fmtRp(total);

  const budget = currentPeriod === 'month' ? BUDGET_RUMAH : Math.round(BUDGET_RUMAH * 7 / 30);
  const pct = Math.min(100, Math.round((total / budget) * 100));
  const fill = document.getElementById('progress');
  fill.style.width = pct + '%';
  if (pct >= 90) fill.style.background = 'var(--danger-bar)';
  else if (pct >= 70) fill.style.background = 'var(--warn-bar)';
  else fill.style.background = 'var(--green-bar)';

  let metaText = pct + '% dari budget ' + fmtRp(budget) + ' · ' + cachedData.length + ' transaksi';
  if (pct < 50 && cachedData.length > 0) metaText += ' · hemat banget 👏';
  else if (pct >= 90) metaText += ' · hati-hati ya';
  document.getElementById('meta').textContent = metaText;
}

function renderContent() {
  const c = document.getElementById('content');
  if (cachedData.length === 0) {
    c.innerHTML = '<div class="empty">Belum ada catatan periode ini<br><span style="font-size:11px;">Yuk mulai catat pengeluaran pertama</span></div>';
    return;
  }

  if (currentView === 'list') {
    c.innerHTML = cachedData.slice(0, 50).map(d => {
      const cat = getCategoryMeta(d.category);
      const dateStr = fmtDate(d.timestamp) + ' ' + fmtTime(d.timestamp);
      return '<div class="row-item">' +
        '<div class="row-left">' +
          '<div class="row-title">' + iconHtml(cat.icon, 16) + escapeHtml(cat.label) + '</div>' +
          '<div class="row-meta">' + escapeHtml(d.note) + ' · ' + dateStr +
            (d.message ? ' <span class="badge badge-msg">' + iconHtml('chat', 10) + 'pesan</span>' : '') +
          '</div>' +
          (d.message ? '<div class="message-box">' + escapeHtml(d.message) + '</div>' : '') +
          '<div class="row-actions">' +
            '<button class="icon-btn" data-act="edit" data-id="' + escapeHtml(d.id) + '">' + iconHtml('edit', 12) + ' edit</button>' +
            '<button class="icon-btn danger" data-act="del" data-id="' + escapeHtml(d.id) + '">' + iconHtml('trash', 12) + ' hapus</button>' +
          '</div>' +
        '</div>' +
        '<div class="row-amount">' + fmtRp(d.amount) + '</div></div>';
    }).join('');

    // Bind actions (no inline onclick)
    c.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        if (btn.dataset.act === 'edit') openEdit(id);
        else if (btn.dataset.act === 'del') deleteItem(id);
      };
    });
  } else {
    const byCat = {};
    cachedData.forEach(d => { byCat[d.category] = (byCat[d.category] || 0) + d.amount; });
    const total = cachedData.reduce((s, d) => s + d.amount, 0);
    const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    c.innerHTML = sorted.map(([cat, amt]) => {
      const meta = getCategoryMeta(cat);
      const pct = Math.round((amt / total) * 100);
      return '<div class="row-item"><div class="row-left">' +
        '<div class="row-title">' + iconHtml(meta.icon, 16) + escapeHtml(meta.label) +
        ' <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">' + pct + '%</span></div>' +
        '<div class="budget-progress" style="margin-top:6px;"><div class="budget-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div><div class="row-amount">' + fmtRp(amt) + '</div></div>';
    }).join('');
  }
}

// ===== Edit modal =====
function openEdit(id) {
  const item = cachedData.find(d => d.id === id);
  if (!item) return;
  editingId = id;
  editSelectedCat = item.category;
  document.getElementById('edit-amount').value = Number(item.amount).toLocaleString('id-ID');
  document.getElementById('edit-note').value = item.note || '';
  document.getElementById('edit-message').value = item.message || '';
  document.querySelectorAll('#edit-cats .opt-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.cat === item.category);
  });
  document.getElementById('edit-modal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('show');
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const amount = parseNum(document.getElementById('edit-amount').value);
  const note = document.getElementById('edit-note').value.trim();
  const message = document.getElementById('edit-message').value.trim();
  const msg = document.getElementById('edit-msg');

  if (!amount) { msg.className = 'msg err'; msg.textContent = 'Nominal kosong'; return; }
  if (!editSelectedCat) { msg.className = 'msg err'; msg.textContent = 'Pilih kategori'; return; }

  try {
    const data = await apiPost({
      action: 'update',
      id: editingId,
      amount: amount,
      note: note,
      category: editSelectedCat,
      message: message
    });
    if (data.ok) {
      closeEditModal();
      toast('✓ Diperbarui');
      loadData();
    } else {
      msg.className = 'msg err'; msg.textContent = 'Gagal';
    }
  } catch (e) { msg.className = 'msg err'; msg.textContent = 'Error koneksi'; }
}

async function deleteItem(id) {
  const ok = await confirmModal('Hapus catatan ini?');
  if (!ok) return;
  try {
    const data = await apiPost({ action: 'delete', id: id });
    if (data.ok) { toast('Dihapus'); loadData(); }
  } catch (e) { toast('Gagal', 'err'); }
}

// Tutup modal kalau tap luar area
document.getElementById('edit-modal').addEventListener('click', e => {
  if (e.target.id === 'edit-modal') closeEditModal();
});

// Init
initGreeting();
if (typeof API_URL === 'undefined' || !API_URL || API_URL.includes('PASTE_URL')) {
  document.getElementById('content').innerHTML =
    '<div class="empty">⚠ API URL belum diset.<br>Edit file <code>config.js</code> dulu ya.</div>';
} else {
  loadData();
}
</script>
</body>
</html>
